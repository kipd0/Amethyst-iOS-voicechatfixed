name: Development Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      id: setup-java
      with:
        java-version: '8'
        distribution: 'zulu'

    - name: Install Dependencies
      run: |
        brew install ldid wget make
        sudo mkdir -p /usr/local/bin
        sudo ln -sf /opt/homebrew/bin/gmake /usr/local/bin/gmake

    - name: Update MoltenVK for Minecraft 26.3
      run: |
        set -euo pipefail

        MVK_DIR="$RUNNER_TEMP/moltenvk142"
        DEST="$GITHUB_WORKSPACE/Natives/resources/Frameworks/libMoltenVK.dylib"

        rm -rf "$MVK_DIR"
        mkdir -p "$MVK_DIR"
        cd "$MVK_DIR"

        echo "Downloading MoltenVK 1.4.2..."

        curl -fL --retry 3 \
          "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar" \
          -o MoltenVK-ios.tar

        tar -xf MoltenVK-ios.tar

        echo "Finding iOS arm64 dynamic MoltenVK..."

        MVK_BIN="$(find "$MVK_DIR" \
          -type f \
          -name "MoltenVK" \
          -path "*dynamic*" \
          | head -n 1)"

        if [ -z "$MVK_BIN" ]; then
          echo "ERROR: Could not find MoltenVK iOS arm64 binary."
          find "$MVK_DIR" -type f | sort
          exit 1
        fi

        echo "Using: $MVK_BIN"

        cp "$MVK_BIN" "$DEST"
        chmod 755 "$DEST"

        codesign --remove-signature "$DEST" 2>/dev/null || true

        install_name_tool \
          -id "@rpath/libMoltenVK.dylib" \
          "$DEST"

        ldid -S "$DEST"

        echo "New MoltenVK:"
        file "$DEST"
        otool -L "$DEST"

    - name: Prepare Minecraft 26.3 JNI
      run: |
        set -e

        JDK_BASE_PATH="${{ steps.setup-java.outputs.path }}"
        WORK_DIR="$RUNNER_TEMP/lwjgl263"
        LWJGL_JAR="$GITHUB_WORKSPACE/JavaApp/libs/others/lwjgl41/lwjgl.jar"

        mkdir -p "$WORK_DIR/macos"
        mkdir -p "$WORK_DIR/classes"

        echo "Downloading LWJGL 3.4.3 JNI sources..."

        curl -fsSL \
          "https://raw.githubusercontent.com/LWJGL/lwjgl3/3.4.3/modules/lwjgl/core/src/generated/c/org_lwjgl_system_JNI.c" \
          -o "$WORK_DIR/org_lwjgl_system_JNI.c"

        curl -fsSL \
          "https://raw.githubusercontent.com/LWJGL/lwjgl3/3.4.3/modules/lwjgl/core/src/main/c/common_tools.h" \
          -o "$WORK_DIR/common_tools.h"

        curl -fsSL \
          "https://raw.githubusercontent.com/LWJGL/lwjgl3/3.4.3/modules/lwjgl/core/src/main/c/macos/macOSConfig.h" \
          -o "$WORK_DIR/macos/macOSConfig.h"

        curl -fsSL \
          "https://raw.githubusercontent.com/LWJGL/lwjgl3/3.4.3/modules/lwjgl/core/src/generated/java/org/lwjgl/system/JNI.java" \
          -o "$WORK_DIR/JNI.java"

        echo "Adding iOS compatibility loader to JNI.java..."

        python3 - "$WORK_DIR/JNI.java" <<'PY'
        from pathlib import Path
        import sys

        path = Path(sys.argv[1])
        text = path.read_text()

        text = text.replace(
            "import org.jspecify.annotations.*;\n",
            ""
        )

        text = text.replace("@Nullable", "")

        old = """    static {
                Library.initialize();
            }
        """

        new = """    static {
                Library.initialize();

                String bundlePath = System.getenv("BUNDLE_PATH");
                if (bundlePath != null) {
                    System.load(bundlePath + "/Frameworks/MC263/liblwjgl263jni.dylib");
                }
            }
        """

        if old not in text:
            raise SystemExit("Could not find JNI static initializer")

        path.write_text(text.replace(old, new, 1))
        PY

        echo "Building iOS JNI compatibility library..."

        xcrun --sdk iphoneos clang \
          -dynamiclib \
          -arch arm64 \
          -miphoneos-version-min=14.0 \
          -DLWJGL_MACOS \
          -DLWJGL_arm64 \
          -I"$JDK_BASE_PATH/include" \
          -I"$JDK_BASE_PATH/include/darwin" \
          -I"$WORK_DIR" \
          -I"$WORK_DIR/macos" \
          "$WORK_DIR/org_lwjgl_system_JNI.c" \
          -Wl,-install_name,@rpath/liblwjgl263jni.dylib \
          -o "$GITHUB_WORKSPACE/Natives/resources/Frameworks/liblwjgl263jni.dylib"

        ldid -S "$GITHUB_WORKSPACE/Natives/resources/Frameworks/liblwjgl263jni.dylib"

        echo "Compiling LWJGL 3.4.3 JNI.class..."

        "$JDK_BASE_PATH/bin/javac" \
          -cp "$LWJGL_JAR" \
          -d "$WORK_DIR/classes" \
          "$WORK_DIR/JNI.java"

        echo "Injecting JNI.class into the 26.3 LWJGL jar..."

        cd "$WORK_DIR/classes"

        "$JDK_BASE_PATH/bin/jar" \
          -uf "$LWJGL_JAR" \
          org/lwjgl/system/JNI.class

        echo "Verifying required 26.3 JNI method..."

        "$JDK_BASE_PATH/bin/javap" \
          -classpath "$LWJGL_JAR" \
          org.lwjgl.system.JNI \
          | grep -F "invokePZ(int, long, long)"

        echo "Verifying matching native JNI function..."

        nm -gU \
          "$GITHUB_WORKSPACE/Natives/resources/Frameworks/liblwjgl263jni.dylib" \
          | grep "Java_org_lwjgl_system_JNI_invokePZ__IJJ"

        echo "Minecraft 26.3 JNI compatibility layer ready."

    - name: Separate legacy and Minecraft 26.3 natives
      run: |
        set -euo pipefail

        FRAMEWORKS="$GITHUB_WORKSPACE/Natives/resources/Frameworks"
        MC263="$FRAMEWORKS/MC263"
        LEGACY_REF="f67d3b19ed9a2d96898bbd67d8f1331715e2d981"

        rm -rf "$MC263"
        mkdir -p "$MC263"

        echo "Saving Minecraft 26.3 native libraries..."

        MC263_FILES=(
          libMoltenVK.dylib
          libSDL3.0.dylib
          libSDL3.dylib
          libfreetype.dylib
          libglfw.dylib
          libglfw_async.dylib
          liblwjgl.dylib
          liblwjgl263jni.dylib
          liblwjgl_msdfgen.dylib
          liblwjgl_nanovg.dylib
          liblwjgl_opengl.dylib
          liblwjgl_stb.dylib
          liblwjgl_tinyfd.dylib
          liblwjgl_vma.dylib
          libopenal.dylib
          libshaderc.dylib
          libspirv-cross.dylib
        )

        for name in "${MC263_FILES[@]}"; do
          if [ ! -f "$FRAMEWORKS/$name" ]; then
            echo "ERROR: Missing 26.3 native: $name"
            exit 1
          fi
          cp "$FRAMEWORKS/$name" "$MC263/$name"
        done

        echo "Restoring Amethyst legacy native libraries..."

        LEGACY_FILES=(
          libMoltenVK.dylib
          libfreetype.dylib
          liblwjgl.dylib
          liblwjgl_nanovg.dylib
          liblwjgl_opengl.dylib
          liblwjgl_stb.dylib
          liblwjgl_tinyfd.dylib
          liblwjgl_vma.dylib
          libopenal.dylib
          libshaderc.dylib
        )

        for name in "${LEGACY_FILES[@]}"; do
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/kipd0/Amethyst-iOS-voicechatfixed/$LEGACY_REF/Natives/resources/Frameworks/$name" \
            -o "$FRAMEWORKS/$name"
        done

        echo "Removing 26.3-only libraries from the legacy Frameworks directory..."

        rm -f \
          "$FRAMEWORKS/libSDL3.0.dylib" \
          "$FRAMEWORKS/libSDL3.dylib" \
          "$FRAMEWORKS/libglfw.dylib" \
          "$FRAMEWORKS/libglfw_async.dylib" \
          "$FRAMEWORKS/liblwjgl263jni.dylib" \
          "$FRAMEWORKS/liblwjgl_msdfgen.dylib" \
          "$FRAMEWORKS/libspirv-cross.dylib"

        echo "Legacy Frameworks:"
        find "$FRAMEWORKS" -maxdepth 1 -type f -name '*.dylib' -print | sort

        echo "Minecraft 26.3 Frameworks:"
        find "$MC263" -maxdepth 1 -type f -name '*.dylib' -print | sort

    - name: Build Amethyst
      run: |
        JDK_BASE_PATH="${{ steps.setup-java.outputs.path }}"
        export PATH="$JDK_BASE_PATH/bin:$PATH"

        make clean \
          JAVA_HOME="$JDK_BASE_PATH" \
          BOOTJDK="$JDK_BASE_PATH/bin" || true

        make \
          JAVA_HOME="$JDK_BASE_PATH" \
          BOOTJDK="$JDK_BASE_PATH/bin"

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: Amethyst
        path: artifacts/org.angelauramc.amethyst-*-ios.ipa
